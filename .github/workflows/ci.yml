name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx next lint --max-warnings 50

      - name: Unit tests
        run: npm test

      # Fail on critical advisories in what ships to users. The remaining
      # "high" (postcss bundled inside next 15) only goes away with Next 16.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=critical

      - name: Build
        run: npm run build
